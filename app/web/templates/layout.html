<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Reports{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/tinphat-ui.css') }}">
</head>
<body>
<header class="tp-header">
  <span class="tp-brand">REPORTS</span>
  <span class="tp-label">Shared Online Beta</span>
</header>
<nav class="ncc-tabs">
  {# Chỉ các tab ĐÃ có trang thật — không dựng chỗ trống "sắp có". #}
  <a class="ncc-tab {{ 'on' if active_tab == 'chay' }}" href="{{ url_for('index') }}">Chạy báo cáo</a>
  <a class="ncc-tab {{ 'on' if active_tab == 'du-lieu' }}" href="{{ url_for('data_tab') }}">Dữ liệu</a>
  <a class="ncc-tab {{ 'on' if active_tab == 'nhan-vien' }}" href="{{ url_for('sellers') }}">Nhân viên</a>
  <a class="ncc-tab {{ 'on' if active_tab == 'doanh-so-ngay' }}" href="{{ url_for('daily_sales') }}">Doanh số ngày</a>
</nav>
<main class="tp-main">
{% block content %}{% endblock %}
</main>
</body>
</html>
