[project]
name = "tinphat-reporting-engine"
version = "0.1.0"
description = "Tín Phát — Công cụ tự động tạo Báo cáo Kinh doanh (Phase 1 engine)"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
]
# S070 — Web Beta V1: chỉ cần khi chạy app/web/*. Core CLI/Tkinter (demo.py,
# owner_launcher.py) không phụ thuộc Flask.
web = [
    "Flask>=3.0",
]
# S071B — Stateless persistence: client S3-compatible cho Cloudflare R2.
# Chỉ import trong tools/storage/r2_store.py (ngoài app/, xem ADR-101) — local
# dev/test không cần cài nếu R2 chưa cấu hình (fallback SQLite, xem
# app/web/storage_backend.py).
storage = [
    "boto3>=1.34",
]
# TASK-PRA-001 — History store (ADR-108): SQLAlchemy Core + Alembic cho
# structured history. `psycopg` chỉ cần ở production (PostgreSQL); local/test
# chạy SQLite nên KHÔNG cần cài driver Postgres để chạy test. Không có
# package nào dưới app/ import psycopg hay alembic — xem tools/db/.
history = [
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
]
# S071 — Shared Online Beta: chỉ cần cho triển khai production (gunicorn
# chạy app/web/wsgi.py). Local launcher (app/web/launcher.py) và test vẫn chỉ
# cần "web" ở trên — gunicorn không tồn tại trên Windows nên KHÔNG gộp vào đó.
web-prod = [
    "tinphat-reporting-engine[web,storage,history]",
    "gunicorn>=22.0; platform_system != 'Windows'",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

# Deployment-packaging repair: repo root có nhiều thư mục top-level không phải
# Python package (config/ — data YAML runtime, PROJECT/ — governance, data/ —
# runtime state, v.v.) — setuptools flat-layout auto-discovery không tự phân
# biệt được, raise "Multiple top-level packages discovered" (build FAIL trên
# Render, Dockerfile:43 `pip install ".[web-prod]"`). Khai báo tường minh
# đúng hai package thật cần cài (app/, tools/) thay vì dựa vào auto-discovery
# mơ hồ — config/ (không có __init__.py, chỉ đọc qua filesystem path lúc
# runtime, xem app/pipeline.py::DEFAULT_CONFIG_DIR) và mọi thư mục khác ở
# repo root tự động bị loại vì không khớp include pattern.
[tool.setuptools.packages.find]
include = ["app*", "tools*"]
