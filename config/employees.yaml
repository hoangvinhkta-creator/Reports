# config/employees.yaml
#
# Master data nhân viên + nhóm nhân viên (DEC-104, DEC-127, ADR-106).
#
# Khớp bằng phần đầu (prefix) của cột NVBH trong file thô — số điện thoại và
# hậu tố phía sau bị bỏ qua khi so khớp (ví dụ prefix "Đức Kiên" khớp giá trị
# thật "Đức Kiên - Tân Á 0867666533").
#
# `group` (DEC-127 §1): Vinh / Quý / Hiệp là BA Employee riêng biệt, giữ
# nguyên danh tính, cùng thuộc `NOI_THANH`. Trước đây cả ba bị gộp thành một
# Employee giả tên "Nội thành" — cách đó làm mất danh tính nhân viên có thật.
# Group là thứ dùng chung ConversionScheme, không phải thứ thay thế con người.
#
# KHÔNG có group "GIA_DUNG": Gia dụng là ProductGroup (thuộc tính của dòng
# hàng), không phải nhóm người — xem docs/adr/ADR-106-product-group-and-line-level-conversion.md.
#
# `default_lead_source: null` nghĩa là dùng mặc định toàn hệ thống
# (config/lead_source.yaml -> PERSONAL). Chỉ Tín Phát có mặc định ADS
# (DEC-109, sửa đổi bởi DEC-119). Đây là khai báo về NGUỒN đơn, không phải
# tỉ lệ quy đổi — tỉ lệ nằm ở config/conversion_rates.yaml.
#
# `effective_from` / `effective_to`: DEC-121 — khi chính sách nhân sự đổi
# trong tương lai, thêm dòng mới thay vì sửa dòng cũ, để không viết lại một
# báo cáo đã phát hành. Nhân viên nghỉ dùng `active: false`, KHÔNG xóa.
#
# Nhân viên chưa có mặt ở đây (raw NVBH không khớp prefix nào) không bị bỏ —
# dòng đó được flag `unmapped` bởi employee_mapper và ConversionScheme trả
# `Unresolved` (DEC-104, DEC-127 §8, C11 — xem docs/analysis/10_OPEN_QUESTIONS.md).

employee_groups:
