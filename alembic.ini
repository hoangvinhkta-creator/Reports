# Alembic — chain migration cho history store (ADR-108, TASK-PRA-001).
# Chỉ chạy ở tầng vận hành (entrypoint deploy / dev), KHÔNG bao giờ import từ
# app/ lúc runtime. URL lấy từ HISTORY_DATABASE_URL qua tools/db (xem env.py),
# nên không có chuỗi kết nối nào nằm trong file này.
[alembic]
script_location = tools/db/migrations
prepend_sys_path = .

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
